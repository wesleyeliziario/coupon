plugins {	id 'org.springframework.boot' version '4.1.1'	id 'io.spring.dependency-management' version '1.1.7'}dependencies {	implementation project(':domain')	implementation 'org.springframework.boot:spring-boot-starter-webmvc'	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'	compileOnly 'org.projectlombok:lombok'	annotationProcessor 'org.projectlombok:lombok'	testCompileOnly 'org.projectlombok:lombok'	testAnnotationProcessor 'org.projectlombok:lombok'	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'	testImplementation 'org.springframework.boot:spring-boot-starter-test'	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'	testImplementation 'org.springframework.boot:spring-boot-starter-jdbc-test'	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'}springBoot {	mainClass = 'br.com.technicalchallenge.coupon.CouponApplication'}bootJar {	archiveFileName = 'app.jar'}jar {	enabled = false}